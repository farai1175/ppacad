<!-- test-taker.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Test - Adaptive Test Assessor</title>
    <link rel="stylesheet" href="tests_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-pencil-alt"></i> Take Test</h1>
            <p class="subtitle">Complete your assessment and track your progress</p>
        </header>
        
        <nav class="main-nav">
            <ul>
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="question-editor.html"><i class="fas fa-edit"></i> Create Questions</a></li>
                <li><a href="test-taker.html" class="active"><i class="fas fa-pencil-alt"></i> Take Test</a></li>
                <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            </ul>
        </nav>
        
        <main>
            <div class="test-container">
                <div class="progress-container">
                    <h2 id="test-title">Test in Progress</h2>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar">0%</div>
                    </div>
                    <p id="progress-text">Question 0 of 0</p>
                </div>
                
                <div id="question-container">
                    <!-- Question will be loaded here by JavaScript -->
                    <div class="loading">
                        <p>Loading test questions...</p>
                    </div>
                </div>
                
                <div class="test-navigation">
                    <button id="prev-btn" class="btn-secondary">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    
                    <div>
                        <button id="next-btn" class="btn-primary">
                            Next <i class="fas fa-arrow-right"></i>
                        </button>
                        <button id="submit-btn" class="btn-primary" style="display: none;">
                            <i class="fas fa-paper-plane"></i> Submit Test
                        </button>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Adaptive Test Assessor &copy; 2023 | All data is stored locally on your device</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
